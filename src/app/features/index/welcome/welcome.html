<div class="welcome-container">
  <mat-card class="welcome-card" appearance="raised">
    <mat-card-header>
      <mat-card-title>Arena Set Cracker</mat-card-title>
      <mat-card-subtitle>Name this workspace — it stays on this device.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>What should we call you?</mat-label>
        <input
          matInput
          [(ngModel)]="username"
          placeholder="e.g., Planeswalker"
          (keyup.enter)="username.trim() && configureApp()"
          required>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions class="actions-panel">
      <button
        mat-raised-button
        color="primary"
        [disabled]="!username.trim()"
        (click)="configureApp()">
        Get Started
      </button>
    </mat-card-actions>

    <footer class="welcome-footer">
      <p>Already have an account synced to the cloud?
        <a routerLink="/login" class="restore-link">Sign in to restore your library</a>
      </p>
      <p>
        You can refine your display name again when you
        <a routerLink="/register" class="restore-link">create a cloud account</a>.
      </p>
    </footer>
  </mat-card>
</div>
